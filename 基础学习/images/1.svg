<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803D"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 20px; font-weight: 700; fill: #0F172A; }
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 16px; font-weight: 700; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 14px; font-weight: 700; fill: #1E293B; }
      .box-sub { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 12px; fill: #475569; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 12px; font-weight: 600; fill: #FFFFFF; }
      .note-text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif; font-size: 12.5px; font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" rx="12" fill="#FFFFFF"/>

  <!-- Main Title -->
  <text x="480" y="38" text-anchor="middle" class="title">传统集中式机器学习 vs. 联邦学习范式对比</text>

  <!-- ==================== LEFT PANEL: Centralized ML ==================== -->
  <rect x="28" y="60" width="440" height="436" rx="12" fill="#FFF5F5" stroke="#FCA5A5" stroke-width="1.5"/>
  <path d="M 28 72 Q 28 60 40 60 L 456 60 Q 468 60 468 72 L 468 102 L 28 102 Z" fill="#FEE2E2"/>
  <text x="248" y="87" text-anchor="middle" class="panel-title" fill="#991B1B">传统集中式学习（数据向模型集中）</text>

  <!-- Cloud Server -->
  <rect x="128" y="122" width="240" height="72" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  <text x="248" y="150" text-anchor="middle" class="box-title">中心云服务器</text>
  <text x="248" y="172" text-anchor="middle" class="box-sub">汇聚全部原始数据并统一训练</text>

  <!-- Upload Arrows (Red Dashed) -->
  <line x1="108" y1="312" x2="188" y2="202" stroke="#DC2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>
  <line x1="248" y1="312" x2="248" y2="202" stroke="#DC2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>
  <line x1="388" y1="312" x2="308" y2="202" stroke="#DC2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>

  <!-- Warning Pill -->
  <rect x="118" y="242" width="260" height="30" rx="15" fill="#DC2626"/>
  <text x="248" y="261" text-anchor="middle" class="badge-text">上传原始敏感数据（隐私泄露风险）</text>

  <!-- Data Sources -->
  <rect x="48" y="318" width="120" height="82" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="108" y="346" text-anchor="middle" class="box-title">数据源 A</text>
  <rect x="60" y="358" width="96" height="30" rx="5" fill="#FEE2E2"/>
  <text x="108" y="377" text-anchor="middle" class="box-sub" fill="#991B1B">医院原始病历</text>

  <rect x="188" y="318" width="120" height="82" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="248" y="346" text-anchor="middle" class="box-title">数据源 B</text>
  <rect x="200" y="358" width="96" height="30" rx="5" fill="#FEE2E2"/>
  <text x="248" y="377" text-anchor="middle" class="box-sub" fill="#991B1B">银行交易流水</text>

  <rect x="328" y="318" width="120" height="82" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="388" y="346" text-anchor="middle" class="box-title">数据源 C</text>
  <rect x="340" y="358" width="96" height="30" rx="5" fill="#FEE2E2"/>
  <text x="388" y="377" text-anchor="middle" class="box-sub" fill="#991B1B">终端用户行为</text>

  <!-- Bottom Summary Left -->
  <rect x="48" y="420" width="400" height="56" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.2"/>
  <text x="248" y="444" text-anchor="middle" class="note-text" fill="#991B1B">核心痛点：原始数据出域触碰合规红线（GDPR/个保法）</text>
  <text x="248" y="464" text-anchor="middle" class="box-sub">各方拒绝共享原始数据，形成严重的“数据孤岛”</text>

  <!-- ==================== RIGHT PANEL: Federated Learning ==================== -->
  <rect x="492" y="60" width="440" height="436" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <path d="M 492 72 Q 492 60 504 60 L 920 60 Q 932 60 932 72 L 932 102 L 492 102 Z" fill="#DCFCE7"/>
  <text x="712" y="87" text-anchor="middle" class="panel-title" fill="#166534">联邦学习（数据不动，模型动）</text>

  <!-- Aggregation Server -->
  <rect x="592" y="122" width="240" height="72" rx="10" fill="#FFFFFF" stroke="#15803D" stroke-width="2"/>
  <text x="712" y="150" text-anchor="middle" class="box-title">中央聚合服务器</text>
  <text x="712" y="172" text-anchor="middle" class="box-sub">仅聚合模型更新，不接触原始数据</text>

  <!-- Bidirectional Arrows -->
  <!-- Client A <-> Server -->
  <line x1="564" y1="312" x2="640" y2="202" stroke="#15803D" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="658" y1="202" x2="582" y2="312" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Client B <-> Server -->
  <line x1="704" y1="312" x2="704" y2="202" stroke="#15803D" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="720" y1="202" x2="720" y2="312" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Client C <-> Server -->
  <line x1="860" y1="312" x2="784" y2="202" stroke="#15803D" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="766" y1="202" x2="842" y2="312" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Action Pills -->
  <rect x="520" y="242" width="182" height="30" rx="15" fill="#15803D"/>
  <text x="611" y="261" text-anchor="middle" class="badge-text">↑ 上传参数/梯度更新</text>

  <rect x="722" y="242" width="182" height="30" rx="15" fill="#2563EB"/>
  <text x="813" y="261" text-anchor="middle" class="badge-text">↓ 下发最新全局模型</text>

  <!-- Clients -->
  <rect x="512" y="318" width="120" height="82" rx="8" fill="#FFFFFF" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="572" y="344" text-anchor="middle" class="box-title">客户端 A</text>
  <rect x="524" y="356" width="96" height="34" rx="5" fill="#ECFDF5" stroke="#86EFAC" stroke-width="1"/>
  <text x="572" y="371" text-anchor="middle" class="box-sub" fill="#166534">本地训练</text>
  <text x="572" y="385" text-anchor="middle" font-size="10.5" fill="#15803D" font-family="sans-serif">数据永不出域</text>

  <rect x="652" y="318" width="120" height="82" rx="8" fill="#FFFFFF" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="712" y="344" text-anchor="middle" class="box-title">客户端 B</text>
  <rect x="664" y="356" width="96" height="34" rx="5" fill="#ECFDF5" stroke="#86EFAC" stroke-width="1"/>
  <text x="712" y="371" text-anchor="middle" class="box-sub" fill="#166534">本地训练</text>
  <text x="712" y="385" text-anchor="middle" font-size="10.5" fill="#15803D" font-family="sans-serif">数据永不出域</text>

  <rect x="792" y="318" width="120" height="82" rx="8" fill="#FFFFFF" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="852" y="344" text-anchor="middle" class="box-title">客户端 C</text>
  <rect x="804" y="356" width="96" height="34" rx="5" fill="#ECFDF5" stroke="#86EFAC" stroke-width="1"/>
  <text x="852" y="371" text-anchor="middle" class="box-sub" fill="#166534">本地训练</text>
  <text x="852" y="385" text-anchor="middle" font-size="10.5" fill="#15803D" font-family="sans-serif">数据永不出域</text>

  <!-- Bottom Summary Right -->
  <rect x="512" y="420" width="400" height="56" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.2"/>
  <text x="712" y="444" text-anchor="middle" class="note-text" fill="#166534">核心优势：原始数据留存本地，满足隐私合规要求</text>
  <text x="712" y="464" text-anchor="middle" class="box-sub">多方协同迭代共享模型，安全打破“数据孤岛”</text>
</svg>